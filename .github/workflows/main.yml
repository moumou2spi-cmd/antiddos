name: Construire AntiDDoS

on:
  push:
    tags: ["v*"]        # une release est créée quand tu pousses un tag, par ex. v1.0.0
  workflow_dispatch:     # ou à la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construire AntiDDoS.exe
        shell: pwsh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          # L'adresse de ton site est embarquée dans l'exe (variable de dépôt SITE_URL, facultative)
          Set-Content -Path site_url.txt -Value "$env:SITE_URL" -NoNewline
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --noconsole --uac-admin --name AntiDDoS --icon icon.ico --add-data "dashboard.html;." --add-data "site_url.txt;." antiddos_win.py

      - name: Construire l'installateur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0' }
          & $iscc "/DAppVersion=$v" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: AntiDDoS-Setup
          path: installer_output/AntiDDoS-Setup.exe

      - name: Publier la release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/AntiDDoS-Setup.exe
